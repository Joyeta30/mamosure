<ion-row class="borderBottom">
  <div>
<swiper-container

  [modules]="swiperModules"
  [slidesPerView]="1.1"
  [initialSlide]="0"
  [centeredSlides]="true"
  [loop]="true"
  [autoplay]="{ delay: 500, disableOnInteraction: false }"
  [spaceBetween]="20"
  [pagination]="{ clickable: true, dynamicBullets: true }"
  
>

 <swiper-slide *ngFor="let image of bannerImages">
      <img [src]="image?.banner" />
    </swiper-slide>

</swiper-container>
  </div>
</ion-row>
