<ion-card class="product-card" [ngClass]="{ 'horizontal-card': smallImage }">
  <div class="card-row">
    <div class="image-wrapper" [ngClass]="{ 'small-image': smallImage }">
      <img [src]="restaurant?.cover || 'assets/image/img1.jpg'" />
    </div>

    <div class="content-wrapper">
      <h3 class="restaurant-title">{{ restaurant?.name }}</h3>
      <p class="price">₹{{ restaurant?.price }}.00</p>
      <p class="subtext">{{ getCuisine(restaurant?.cuisines) }}</p>
      <!-- <span>{{ restaurant?.delivery_time }} min</span> ·  -->
      <!-- <span *ngIf="restaurant?.distance">{{ restaurant?.distance | number: '0.0-1' }} km</span> -->
      <div class="rating-row">
        <ion-icon name="star"></ion-icon>
        <span>{{ restaurant?.rating }}</span>
      </div>
    </div>
  </div>
</ion-card>
