<app-header></app-header>
<ion-content>

  <div *ngIf="isLoading"><ion-skeleton-text animated style="height: 25vh;"></ion-skeleton-text></div>
  <app-loading-restaurant *ngIf="isLoading"></app-loading-restaurant>
  
  <app-banner *ngIf="!isLoading" [bannerImages]="banners"></app-banner>

  <ion-list *ngIf="!isLoading">
    <ion-list-header class="ion-margin-bottom">
      <ion-label>
        <h1>Match Your Style</h1>
        <p>Discover unique tastes near you</p><br>
       <!-- Filter Buttons -->
    <div class="filter-buttons">
      <button 
        [class.active]="selectedFilter === 'trending'" 
        (click)="setFilter('trending')">
        Trending Now
      </button>
      <button 
        [class.active]="selectedFilter === 'all'" 
        (click)="setFilter('all')">
        All
      </button>
      <button 
        [class.active]="selectedFilter === 'new'" 
        (click)="setFilter('new')">
        New
      </button>
    </div>
  </ion-label>
</ion-list-header>

    <ion-item-group *ngIf="restaurants?.length > 0">
      <app-restaurant 
        *ngFor="let restaurant of restaurants" 
        [restaurant]="restaurant"
        [routerLink]="['/', 'tabs', 'restaurants', restaurant.uid]"></app-restaurant>
    </ion-item-group>
  </ion-list>

</ion-content>
